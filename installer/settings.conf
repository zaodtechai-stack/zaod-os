# Zaod OS installer: Calamares settings.
# Installation runs offline from the on-image local repository; nothing is fetched.
---
modules-search: [ local ]

instances:
  - id: zaod-packages
    module: packagechooser
    config: packages.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - packagechooser@zaod-packages
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - zaod-repo
      - initramfs
      - initcpiocfg
      - bootloader-config
      - bootloader
      - umount
  - show:
      - finished

branding: zaod

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
