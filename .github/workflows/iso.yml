name: iso

# Builds the installable/live ISO on a host that allows privileged mounts, which
# a nested sandbox does not. Every input is the same tree a developer builds from:
# rootfs/packages.list, the Phase 6 desktop layer, apps/ and boot/.
#
# The image ships the Zaod kernel: Linux 6.18.63 built from the source archive
# pinned in docs/versions.md with kernel/zaod_defconfig. A distribution kernel is
# deliberately not a fallback - `uname -r` on the released image has to report
# 6.18.63-zaod - so the kernel is built in its own job and handed to the image
# job, and a failed kernel build stops the release instead of silently producing
# a Debian-kernel image.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "rootfs/**"
      - "boot/**"
      - "kernel/**"
      - "apps/**"
      - "desktop/**"
      - "Makefile"
      - ".github/workflows/iso.yml"

permissions:
  contents: write

jobs:
  kernel:
    name: kernel 6.18.63-zaod
    runs-on: ubuntu-24.04
    # A full x86_64 kernel build is the longest step in the pipeline; the budget
    # leaves room for a compile on the two-core runner without ever being the
    # reason a release is cut early.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /opt/az
          sudo apt-get clean
          df -h /

      - name: Install kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev dwarves \
            cpio zstd xz-utils git gnupg python3 ca-certificates
          for tool in gcc make bison flex cpio zstd xz git gpg python3; do
            printf '%-10s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done

      - name: Restore a kernel built from this exact config
        id: kernel-cache
        uses: actions/cache@v4
        with:
          path: build/out/kernel
          key: kernel-6.18.63-${{ hashFiles('kernel/zaod_defconfig', 'kernel/build.sh', 'scripts/fetch.sh', 'scripts/build-firmware.sh') }}

      - name: Fetch the pinned kernel source and verify its signature
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: make fetch

      - name: Build the Zaod kernel, its modules and the firmware bundle
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: make kernel

      - name: Prove the artifact is the Zaod kernel
        # The image must never need to trust a version string in a document: the
        # release is read out of the packed modules, which carry the kernel's own
        # release name, and the config has to be the one this repository ships.
        run: |
          set -euo pipefail
          ls -l build/out/kernel
          for artifact in vmlinuz modules.tar.gz firmware.tar.xz System.map config; do
            test -s "build/out/kernel/$artifact" || {
              echo "build/out/kernel/$artifact is missing" >&2
              exit 1
            }
          done
          # List the archive into a file instead of piping it into head/grep -q:
          # those exit on their first match, tar then dies of SIGPIPE, and with
          # `pipefail` that broken pipe was reported as a missing modules.dep.
          listing="$(mktemp)"
          tar -tzf build/out/kernel/modules.tar.gz > "$listing"
          release="$(sed -n 's#^\./lib/modules/\([^/]*\)/.*#\1#p' "$listing" \
            | LC_ALL=C sort -u | sed -n 1p)"
          printf 'kernel release: %s\n' "$release"
          case "$release" in
            6.18.*-zaod) ;;
            *)
              echo "the image would ship '$release', not the Zaod 6.18 kernel" >&2
              exit 1
              ;;
          esac
          cmp -s build/out/kernel/config kernel/zaod_defconfig \
            || echo "note: the built config differs from kernel/zaod_defconfig (build.sh normalises it)"
          grep -Fxq "./lib/modules/$release/modules.dep" "$listing" || {
            echo "modules.dep is missing from the modules archive" >&2
            grep -m 5 './lib/modules/.*/modules\.' "$listing" || true
            exit 1
          }
          modules="$(grep -c '^./lib/modules/.*\.ko$' "$listing" || true)"
          printf 'modules in the archive: %s\n' "$modules"
          test "$modules" -gt 0 || { echo "the modules archive carries no .ko files" >&2; exit 1; }
          sha256sum build/out/kernel/vmlinuz build/out/kernel/modules.tar.gz

      - name: Upload the kernel for the image job
        uses: actions/upload-artifact@v4
        with:
          name: zaod-kernel
          path: |
            build/out/kernel/vmlinuz
            build/out/kernel/System.map
            build/out/kernel/config
            build/out/kernel/modules.tar.gz
            build/out/kernel/modules.list
            build/out/kernel/firmware.tar.xz
            build/out/kernel/firmware-source-commit.txt
          retention-days: 30
          if-no-files-found: error

  build-iso:
    name: image
    needs: kernel
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /opt/az
          sudo apt-get clean
          df -h /

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap mmdebstrap squashfs-tools xorriso mtools \
            grub-pc-bin grub-efi-amd64-bin busybox-static zstd cpio \
            dosfstools rsync python3
          for tool in mksquashfs xorriso grub-mkimage mformat busybox cpio zstd; do
            printf '%-14s %s\n' "$tool" "$(command -v "$tool" || echo MISSING)"
          done

      - name: Fetch the current Debian archive keyring
        # The runner image ships a keyring older than trixie, which cannot
        # verify the trixie InRelease file. This is the archive keyring for the
        # base system only; the kernel comes from the build above.
        run: |
          set -euo pipefail
          base="https://deb.debian.org/debian/pool/main/d/debian-archive-keyring/"
          pkg="$(curl -fsSL "$base" | grep -o 'debian-archive-keyring_[0-9.]*_all\.deb' | sort -V | tail -n 1)"
          echo "installing $pkg"
          curl -fsSLO "$base$pkg"
          sudo dpkg -i "$pkg"
          ls -l /usr/share/keyrings/debian-archive-keyring.gpg

      - name: Fetch the Zaod kernel from the kernel job
        uses: actions/download-artifact@v4
        with:
          name: zaod-kernel
          path: build/out/kernel

      - name: Build root filesystem
        run: sudo env DEBIAN_KEYRING=/usr/share/keyrings/debian-archive-keyring.gpg bash scripts/build-rootfs.sh

      - name: Build initramfs
        run: sudo -E bash scripts/make-initramfs.sh

      - name: Assemble ISO
        run: sudo -E bash scripts/make-iso.sh

      - name: Confirm the ISO carries the Zaod kernel
        run: |
          set -euo pipefail
          release="$(grep -m 1 '^kernel: ' build/logs/rootfs-report.txt | cut -d' ' -f2)"
          printf 'rootfs kernel: %s\n' "$release"
          case "$release" in
            6.18.*-zaod) ;;
            *)
              echo "the rootfs carries '$release', not the Zaod kernel" >&2
              exit 1
              ;;
          esac

      - name: Hand the build output back to the runner
        # Every build step runs through sudo, so build/out and the image inside
        # it belong to root. The checksum step then could not create SHA256SUMS
        # beside the image ("SHA256SUMS: Permission denied") after the ISO had
        # already been written successfully.
        run: sudo chown -R "$(id -u):$(id -g)" build/out

      - name: Checksums and size
        run: |
          cd build/out
          sha256sum ./*.iso > SHA256SUMS
          cat SHA256SUMS
          du -h ./*.iso

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: zaod-os-iso
          path: |
            build/out/*.iso
            build/out/SHA256SUMS
          retention-days: 30
          if-no-files-found: error

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: iso-${{ github.run_number }}
          name: Zaod OS ISO (build ${{ github.run_number }})
          body: |
            Live/installable hybrid ISO built from `${{ github.sha }}`.

            Kernel: Linux 6.18.63-zaod, compiled from the pinned kernel.org source
            archive with `kernel/zaod_defconfig`. No distribution kernel is involved.
            Desktop: Plasma 6 with the Zaod Fluent design layer from Phase 6.
            Verify with `sha256sum -c SHA256SUMS` before writing to USB.
          files: |
            build/out/*.iso
            build/out/SHA256SUMS
          fail_on_unmatched_files: true
