# Nothing may hold the boot forever.
#
# iso-30 and iso-31 were reported stuck on a plain still photo of the boot log,
# and the unit that was holding it up could not be read off the screen. systemd's
# own start timeout is 90 s but a unit that overrides it (TimeoutStartSec=0) - or
# one that is waiting on hardware that never answers - takes the whole boot with
# it. 75 s is the ceiling here: slow hardware still gets a fair chance, and a
# stalled unit fails, is reported as failed, and lets sysinit, multi-user and the
# display manager carry on. an installed system is unaffected in practice: its
# units finish in well under a second.
[Manager]
DefaultTimeoutStartSec=75
DefaultTimeoutStopSec=25
