# ldconfig.service rebuilds /etc/ld.so.cache from every library on the
# machine and carries no timeout of its own. On slow media that is minutes
# of a boot that looks hung: iso-29 sat in
#   [*     ] Job ldconfig.service/start running (no limit)
# exactly where people reported it froze. Live media masks the unit outright
# (boot/initramfs/zaod-live) because a read-only root cannot change its
# libraries. An installed machine still wants the cache refreshed after /etc
# changes, so the unit runs here - it just cannot hold the boot for ever.
[Service]
TimeoutStartSec=60
