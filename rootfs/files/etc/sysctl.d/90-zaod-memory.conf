# Keep interactive latency good on small machines: swap sooner rather than
# letting the page cache crowd out the desktop, and avoid huge dirty pages.
vm.swappiness = 100
vm.vfs_cache_pressure = 150
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.min_free_kbytes = 65536
kernel.sched_autogroup_enabled = 1
