# earlyoom kills the largest offender before the kernel livelocks the desktop.
# A terminal emulator dying is a better outcome than a frozen session.
EARLYOOM_ARGS="-r 60 -m 5 -M 200000 --avoid '(^|/)(systemd|sshd|sddm|Xorg|kwin_wayland|plasmashell)$' --prefer '(^|/)(firefox|chrome|chromium|electron)'"
