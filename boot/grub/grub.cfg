# Zaod OS GRUB configuration.
#
# One ISO boots on both firmware families. The menu only ever adds parameters;
# it never writes to the media it booted from, so a menu entry cannot damage a
# machine. Set the timeout to 5 s so an unattended boot stays predictable.

set timeout=5
set default=0
set gfxmode=auto
set gfxpayload=keep
set recordfail=0

insmod all_video
insmod gfxterm
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod search_label
insmod normal
terminal_output gfxterm

# Locate the ISO by its volume label, never by device name.
search --no-floppy --label --set=root ZAODOS

# tty0 comes LAST on purpose. The kernel gives /dev/console to the last
# `console=` it registers, and systemd writes its own status there. With
# console=tty0 first and ttyS0 last - where iso-30 left it - a laptop that
# exposes a /dev/ttyS0 node but has no serial port sends every systemd message
# into a device nobody is looking at: the initramfs text ends with
# "handing over to the live system" and the screen then stays blank while the
# machine keeps booting. Serial still gets the same copy, so a headless boot or
# a VM is still debuggable, and `systemd.show_status=1` keeps the unit lines
# coming instead of a bare progress bar.
# `quiet` is deliberately absent: when a boot cannot find its media, a silent
# screen is what turns a one-line kernel message into "it just panics".
# `splash` is deliberately absent and `plymouth.enable=0` turns the daemon off
# outright. The package enables plymouth-start.service, so on iso-29 plymouthd
# ran against a text console on every boot, owned the console the onboarding
# wizard was drawing on, and left plymouth-quit-wait (TimeoutSec=0) waiting for
# a splash that could never quit. The boot stays readable, as the design wants.
# selinux=0 is deliberate: the kernel builds SELinux in as its default LSM
# and the image carries no policy, so without it every boot prints
# "SELinux: Could not open policy file" and runs with no policy at all.
set zaod_cmdline="boot=live components plymouth.enable=0 loglevel=4 selinux=0 console=ttyS0,115200 console=tty0 systemd.show_status=1"

menuentry "Zaod OS (live session)" {
  linux /boot/vmlinuz $zaod_cmdline zaod.live=1 \
        root=live:LABEL=ZAODOS rd.live.image rd.live.dir=/boot/zaod rd.live.squashimg=zaod-os-x86_64.squashfs
  initrd /boot/initramfs.img
}

menuentry "Zaod OS (safe graphics)" {
  linux /boot/vmlinuz $zaod_cmdline zaod.live=1 zaod.safegfx=1 nomodeset \
        video=1024x768 root=live:LABEL=ZAODOS rd.live.image rd.live.dir=/boot/zaod rd.live.squashimg=zaod-os-x86_64.squashfs
  initrd /boot/initramfs.img
}

menuentry "Zaod OS (copy to RAM, needs 4 GB)" {
  linux /boot/vmlinuz $zaod_cmdline zaod.live=1 zaod.toram=1 \
        root=live:LABEL=ZAODOS rd.live.image rd.live.dir=/boot/zaod rd.live.squashimg=zaod-os-x86_64.squashfs
  initrd /boot/initramfs.img
}

menuentry "Install Zaod OS to this computer" {
  linux /boot/vmlinuz $zaod_cmdline zaod.live=1 zaod.installer=1 \
        root=live:LABEL=ZAODOS rd.live.image rd.live.dir=/boot/zaod rd.live.squashimg=zaod-os-x86_64.squashfs
  initrd /boot/initramfs.img
}

menuentry "Boot from the first internal disk" {
  set root=(hd0)
  chainloader +1
}

if [ "$grub_platform" = "efi" ]; then
  menuentry "UEFI firmware settings" {
    fwsetup
  }
fi

menuentry "Rescue shell" {
  linux /boot/vmlinuz $zaod_cmdline zaod.live=1 zaod.rescue=1 \
        root=live:LABEL=ZAODOS rd.live.image rd.live.dir=/boot/zaod rd.live.squashimg=zaod-os-x86_64.squashfs
  initrd /boot/initramfs.img
}

# A bootable USB stick built by scripts/write-usb.sh carries the same label, so
# these entries work unchanged from a stick.
