[Theme]
Current=zaod
CursorTheme=Zaod
Font=Inter

[Users]
DefaultIcon=/usr/share/sddm/themes/zaod/faces/user.svg
MaximumUid=60000
MinimumUid=1000

[Autologin]
Relogin=false
Session=zaod

[General]
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot
Numlock=off
InputMethod=qtvirtualkeyboard

[Wayland]
EnableHiDPI=true
SessionDir=/usr/share/wayland-sessions
