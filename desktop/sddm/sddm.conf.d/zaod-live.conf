# Live media only. The installed system must never contain a passwordless
# account, so this file is dropped when the ISO is installed to disk.
#
# Live media signs in the same way the installed system does: the Zaod login
# screen asks for the account and the password.
#
# There is deliberately no [Autologin] section. Autologin raced the login
# screen: when the session came up the credentials were never on screen at all,
# and when it failed the person was left facing a login box for an account whose
# password they had never been told. Live credentials are zaodlive / zaod, they
# are printed by /etc/issue above every text-console prompt, and they are
# documented in docs/desktop.md.
[General]
Numlock=off
