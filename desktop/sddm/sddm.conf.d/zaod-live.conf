# Live media only. The installed system must never contain a passwordless
# account, so this file is dropped when the ISO is installed to disk.
#
# Live credentials are zaodlive / zaod, printed by /etc/issue above every
# text-console prompt and documented in docs/desktop.md.
# Live media signs in by itself. Asking for a password nobody was told keeps a
# person on a login box that looks like the desktop is "open" while no app can be
# started, which is exactly how the last three days went. The demo account is
# password-protected on disk (zaodlive / zaod); autologin only skips the prompt
# on removable media, and this file is removed when the image is installed.
[Autologin]
User=zaodlive
Session=zaod
Relogin=true

[General]
Numlock=off
