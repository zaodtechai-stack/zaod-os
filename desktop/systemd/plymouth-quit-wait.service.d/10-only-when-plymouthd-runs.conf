# Boot must never stall on a splash that is not running.
#
# Zaod OS boots in text mode: `splash` is not on the kernel command line and
# plymouth-start.service is not enabled, so plymouthd never starts and
# /run/plymouth/pid never appears. `plymouth --wait` still waited for that splash
# and the unit carries TimeoutSec=0, so on iso-26 it stayed in "starting" for
# ever: multi-user.target was never reached and sddm never started. Gating the
# unit on the daemon's pid file costs nothing when plymouth does run and makes
# the hang impossible when it does not.
[Unit]
ConditionPathExists=/run/plymouth/pid
